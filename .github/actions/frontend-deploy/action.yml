name: 'Frontend Deployment'
description: 'Deploy frontend to Firebase Hosting'
inputs:
  environment:
    description: 'Environment (dev/prod)'
    required: true
  firebase-service-account:
    description: 'Firebase Service Account JSON'
    required: true
  api-url:
    description: 'API base URL from Terraform'
    required: true
  firebase-api-key:
    description: 'Firebase API key'
    required: true
  firebase-auth-domain:
    description: 'Firebase auth domain'
    required: true
  firebase-project-id:
    description: 'Firebase project ID'
    required: true
  firebase-storage-bucket:
    description: 'Firebase storage bucket'
    required: true
  firebase-messaging-sender-id:
    description: 'Firebase messaging sender ID'
    required: true
  firebase-app-id:
    description: 'Firebase app ID'
    required: true
  firebase-measurement-id:
    description: 'Firebase measurement ID'
    required: true
  firebase-vapid-key:
    description: 'Firebase VAPID Key'
    required: true
  project-id:
    description: 'Firebase Project ID'
    required: false
    default: 'restohand-solutions'
outputs:
  hosting-url:
    description: 'Admin Firebase Hosting URL'
    value: ${{ steps.deploy.outputs.admin-url }}
  admin-url:
    description: 'Admin Firebase Hosting URL'
    value: ${{ steps.deploy.outputs.admin-url }}
  staff-url:
    description: 'Staff Firebase Hosting URL'
    value: ${{ steps.deploy.outputs.staff-url }}
  deployment-status:
    description: 'Deployment status'
    value: ${{ steps.deploy.outcome }}
  firebase-preview-url:
    description: 'Firebase preview URL (for non-prod deployments)'
    value: ${{ steps.deploy.outputs.admin-url }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Cache Nx
      uses: actions/cache@v4
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('nx.json', 'workspace.json', 'apps/*/project.json', 'libs/*/project.json') }}
        restore-keys: |
          nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
          nx-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: |
        npm install --legacy-peer-deps
        echo "✅ Dependencies installed"

    - name: Setup environment variables
      shell: bash
      run: |
        # Use individual Firebase configuration values from inputs

        # Create comprehensive environment file for frontend app
        cat > apps/frontend/.env << EOF
        VITE_API_BASE_URL=${{ inputs.api-url }}/api
        VITE_WS_BASE_URL=${{ inputs.api-url }}
        VITE_APP_TIMEZONE=Asia/Kolkata
        VITE_FIREBASE_API_KEY=${{ inputs.firebase-api-key }}
        VITE_FIREBASE_AUTH_DOMAIN=${{ inputs.firebase-auth-domain }}
        VITE_FIREBASE_PROJECT_ID=${{ inputs.firebase-project-id }}
        VITE_FIREBASE_STORAGE_BUCKET=${{ inputs.firebase-storage-bucket }}
        VITE_FIREBASE_MESSAGING_SENDER_ID=${{ inputs.firebase-messaging-sender-id }}
        VITE_FIREBASE_APP_ID=${{ inputs.firebase-app-id }}
        VITE_FIREBASE_MEASUREMENT_ID=${{ inputs.firebase-measurement-id }}
        VITE_FIREBASE_VAPID_KEY=${{ inputs.firebase-vapid-key }}
        VITE_ENVIRONMENT=${{ inputs.environment }}
        VITE_CASHFREE_ENVIRONMENT=sandbox
        EOF
        echo "✅ Environment variables configured"
        echo "📋 Environment file contents:"
        cat apps/frontend/.env

    - name: Update Firebase Service Worker
      shell: bash
      run: |
        # Update service worker with environment-specific Firebase config
        cat > apps/frontend/public/firebase-messaging-sw.js << 'EOF'
        // Import Firebase scripts for service worker
        importScripts('https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js');
        importScripts('https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js');

        // Firebase configuration
        const firebaseConfig = {
          apiKey: '${{ inputs.firebase-api-key }}',
          authDomain: '${{ inputs.firebase-auth-domain }}',
          projectId: '${{ inputs.firebase-project-id }}',
          storageBucket: '${{ inputs.firebase-storage-bucket }}',
          messagingSenderId: '${{ inputs.firebase-messaging-sender-id }}',
          appId: '${{ inputs.firebase-app-id }}',
          measurementId: '${{ inputs.firebase-measurement-id }}'
        };

        // Initialize Firebase in service worker
        firebase.initializeApp(firebaseConfig);

        // Initialize Firebase Cloud Messaging
        const messaging = firebase.messaging();

        // Handle background messages
        messaging.onBackgroundMessage(function(payload) {
          console.log('[firebase-messaging-sw.js] Received background message:', payload);

          // Extract notification data
          const notificationTitle = payload.notification?.title || 'Call Waiter Alert';
          const notificationOptions = {
            body: payload.notification?.body || 'Customer needs assistance',
            icon: '/favicon.ico',
            badge: '/favicon.ico',
            tag: payload.data?.callId || 'call-waiter-alert',
            data: payload.data,
            requireInteraction: payload.data?.urgency === 'urgent',
            vibrate: payload.data?.urgency === 'urgent' ? [200, 100, 200] : [100],
            actions: [
              {
                action: 'acknowledge',
                title: 'Acknowledge',
                icon: '/favicon.ico'
              },
              {
                action: 'view',
                title: 'View Details',
                icon: '/favicon.ico'
              }
            ]
          };

          // Show notification
          return self.registration.showNotification(notificationTitle, notificationOptions);
        });

        // Handle notification click events
        self.addEventListener('notificationclick', function(event) {
          console.log('[firebase-messaging-sw.js] Notification click received:', event);

          const { notification, action } = event;
          const data = notification.data;

          // Close the notification
          notification.close();

          if (action === 'acknowledge') {
            // Handle acknowledge action - open to service page
            event.waitUntil(
              clients.matchAll({ type: 'window', includeUncontrolled: true }).then(clientList => {
                // Try to find an existing window to focus
                for (const client of clientList) {
                  if (client.url.includes('/service') && 'focus' in client) {
                    return client.focus().then(() => {
                      client.postMessage({
                        type: 'ACKNOWLEDGE_CALL_ALERT',
                        callId: data.callId
                      });
                    });
                  }
                }
                // No existing window found, open a new one
                if (clients.openWindow) {
                  return clients.openWindow('/service?action=acknowledge&callId=' + (data.callId || ''));
                }
              })
            );
          } else if (action === 'view' || !action) {
            // Handle view action or default click
            const urlToOpen = '/service?callId=' + (data.callId || '');

            // Focus existing window or open new one
            event.waitUntil(
              clients.matchAll({ type: 'window', includeUncontrolled: true }).then(clientList => {
                // Try to find an existing window to focus
                for (const client of clientList) {
                  if (client.url.includes('/service') && 'focus' in client) {
                    return client.focus().then(() => {
                      client.postMessage({
                        type: 'FOCUS_CALL_ALERT',
                        callId: data.callId
                      });
                    });
                  }
                }
                // No existing window found, open a new one
                if (clients.openWindow) {
                  return clients.openWindow(urlToOpen);
                }
              })
            );
          }
        });

        // Handle notification close events
        self.addEventListener('notificationclose', function(event) {
          console.log('[firebase-messaging-sw.js] Notification closed:', event.notification.data);
        });

        console.log('[firebase-messaging-sw.js] Service worker loaded and ready for FCM');
        EOF

        echo "✅ Firebase service worker updated with environment-specific configuration"

    - name: Build frontend app
      shell: bash
      run: |
        # Build frontend app with production configuration
        npx nx build frontend
        echo "✅ frontend app built successfully"

        # Verify build output
        ls -la apps/frontend/dist/
        echo "📦 Build artifacts ready for deployment"

    - name: Setup Firebase CLI
      shell: bash
      run: |
        npm install -g firebase-tools
        echo "✅ Firebase CLI installed"

    - name: Deploy to Firebase Hosting (Admin & Staff)
      id: deploy
      shell: bash
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ inputs.firebase-service-account }}
      run: |
        # Setup service account
        echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-service-account.json
        export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json

        # Set correct project
        PROJECT_ID="${{ inputs.environment == 'prod' && 'restohand-p' || 'restohand-d' }}"
        firebase use $PROJECT_ID

        # Deploy to both admin and staff targets
        firebase deploy --only hosting:admin,hosting:staff,hosting:customer --force

        # Get deployment URLs
        ADMIN_URL="https://${{ inputs.environment == 'prod' && 'restohand-p-admin' || 'restohand-d-admin' }}.web.app"
        STAFF_URL="https://${{ inputs.environment == 'prod' && 'restohand-p-staff' || 'restohand-d-staff' }}.web.app"
        CUSTOMER_URL="https://${{ inputs.environment == 'prod' && 'restohand-p-customer' || 'restohand-d-customer' }}.web.app"

        echo "admin-url=$ADMIN_URL" >> $GITHUB_OUTPUT
        echo "staff-url=$STAFF_URL" >> $GITHUB_OUTPUT
        echo "details_url=$ADMIN_URL" >> $GITHUB_OUTPUT  # For compatibility

        echo "✅ Deployed to both admin and staff sites"
        echo "🔗 Admin: $ADMIN_URL"
        echo "🔗 Staff: $STAFF_URL"

    - name: Verify deployment
      shell: bash
      run: |
        ADMIN_URL="${{ steps.deploy.outputs.admin-url }}"
        STAFF_URL="${{ steps.deploy.outputs.staff-url }}"

        # Wait for deployment to be ready
        echo "🔄 Waiting for deployment to be ready..."
        sleep 15

        # Verify admin site
        echo "🔍 Verifying admin site: $ADMIN_URL"
        for i in {1..3}; do
          if curl -f --max-time 30 "$ADMIN_URL" > /dev/null 2>&1; then
            echo "✅ Admin site verified successfully!"
            break
          elif [ $i -eq 3 ]; then
            echo "⚠️ Admin site verification failed, but deployment may still be propagating"
          else
            sleep 10
          fi
        done

        # Verify staff site
        echo "🔍 Verifying staff site: $STAFF_URL"
        for i in {1..3}; do
          if curl -f --max-time 30 "$STAFF_URL" > /dev/null 2>&1; then
            echo "✅ Staff site verified successfully!"
            break
          elif [ $i -eq 3 ]; then
            echo "⚠️ Staff site verification failed, but deployment may still be propagating"
          else
            sleep 10
          fi
        done

    - name: Cleanup
      shell: bash
      if: always()
      run: |
        rm -f apps/frontend/.env
        echo "✅ Cleanup completed"
