name: 'Docker Build and Push'
description: 'Build and push Docker images with caching'
inputs:
  environment:
    description: 'Environment (dev/prod)'
    required: true
  app-name:
    description: 'Application name (api/website)'
    required: true
  dockerfile:
    description: 'Path to Dockerfile'
    required: true
  gcp-service-account:
    description: 'GCP Service Account JSON'
    required: true
  workload-identity-provider:
    description: 'GCP Workload Identity Provider'
    required: true
  registry:
    description: 'Docker registry URL'
    required: false
    default: 'asia-south1-docker.pkg.dev'
outputs:
  image-url:
    description: 'Full Docker image URL'
    value: ${{ steps.meta.outputs.image-url }}
  image-digest:
    description: 'Docker image digest'
    value: ${{ steps.build.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.gcp-service-account }}

    - name: Setup Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ inputs.environment == 'prod' && 'restohand' || 'restohand-develop' }}

    - name: Configure Docker for Artifact Registry
      shell: bash
      run: |
        gcloud auth configure-docker ${{ inputs.registry }} --quiet
        echo "✅ Docker configured for Artifact Registry"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: network=host

    - name: Generate image metadata
      id: meta
      shell: bash
      run: |
        PROJECT_ID="${{ inputs.environment == 'prod' && 'restohand' || 'restohand-develop' }}"

        # Set repository name based on environment (matching local deploy script)
        if [[ "${{ inputs.environment }}" == "dev" ]]; then
          REPOSITORY="dev-registry"
        else
          REPOSITORY="prod-registry"
        fi

        IMAGE_NAME="${{ inputs.registry }}/$PROJECT_ID/$REPOSITORY/${{ inputs.app-name }}"

        # Generate tags
        if [[ "${{ inputs.environment }}" == "prod" ]]; then
          TAGS="$IMAGE_NAME:latest,$IMAGE_NAME:${{ github.sha }},$IMAGE_NAME:prod-$(date +%Y%m%d-%H%M%S)"
        else
          TAGS="$IMAGE_NAME:${{ inputs.environment }},$IMAGE_NAME:${{ github.sha }},$IMAGE_NAME:${{ inputs.environment }}-$(date +%Y%m%d-%H%M%S)"
        fi

        echo "image-url=$IMAGE_NAME" >> $GITHUB_OUTPUT
        echo "tags=$TAGS" >> $GITHUB_OUTPUT
        echo "✅ Image metadata generated: $IMAGE_NAME"

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NODE_ENV=production
          BUILDKIT_INLINE_CACHE=1

    - name: Verify image
      shell: bash
      run: |
        IMAGE_URL="${{ steps.meta.outputs.image-url }}:${{ github.sha }}"
        gcloud container images describe $IMAGE_URL --quiet
        echo "✅ Image verified: $IMAGE_URL"
